name: Validate links and naming

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check filenames are lowercase kebab-case ASCII
        run: |
          python3 - <<'PY'
          import pathlib, sys
          root = pathlib.Path('.')
          allowed = {'AGENTS.md','README.md','README.en.md','CHANGELOG.md',
                     'CONTRIBUTING.md','llms.txt'}
          bad = []
          for f in root.rglob('*'):
              if not f.is_file() or '.git' in f.parts:
                  continue
              if f.name in allowed:
                  continue
              if any(ord(c) > 127 or c.isupper() for c in f.name):
                  bad.append(str(f))
          for line in bad:
              print('NON-ASCII OR UPPERCASE:', line)
          sys.exit(1 if bad else 0)
          PY

      - name: Check relative links resolve (markdown and llms.txt)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          docs = list(root.rglob('*.md')) + [root / 'llms.txt']
          bad = []
          for doc in docs:
              text = doc.read_text(encoding='utf-8')
              for target in re.findall(r'\[[^\]]*\]\(([^)]+)\)', text):
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  path = target.split('#')[0]
                  if not path:
                      continue
                  resolved = (doc.parent / path).resolve()
                  if not resolved.exists():
                      bad.append(f'{doc}: broken link -> {target}')
          for line in bad:
              print(line)
          sys.exit(1 if bad else 0)
          PY

      - name: Ensure every skill is listed in llms.txt
        run: |
          python3 - <<'PY'
          import pathlib, sys
          root = pathlib.Path('.')
          index = (root / 'llms.txt').read_text(encoding='utf-8')
          missing = [f.name for f in sorted((root / 'skills').glob('*.md'))
                     if f.name not in index]
          for name in missing:
              print('MISSING FROM llms.txt:', name)
          sys.exit(1 if missing else 0)
          PY

      - name: Ensure project handbooks are not tracked
        run: |
          if git ls-files projects/ | grep -q .; then
            echo "ERROR: projects/ must not be tracked in this repository"
            git ls-files projects/
            exit 1
          fi
          grep -qxF 'projects/' .gitignore
